[project]
name = "taxi-cli"
version = "0.0.0"
description = "CLI untuk laporan analitik dataset NYC TLC Yellow Taxi."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Budi Santoso", email = "nganguk1@gmail.com" }
]
keywords = ["cli", "taxi", "nyc=tlc", "pandas", "analytics"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.scripts]
taxi-report = "taxi_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_cli"]

# --- Ruff (lint + format) ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "D"]
ignore = ["D100", "D104"]  # docstring modul opsional

[tool.ruff.lint.pydocstyle]
convention = "google"


# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src/taxi_cli --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/taxi_cli"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
